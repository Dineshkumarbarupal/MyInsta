<article class="post-card panel" data-post-id="{{id}}"><header class="post-header"><div class="post-author"><img class="post-avatar" src="{{avatar}}" alt=""><div><strong>{{name}} <span class="verified-dot">✓</span></strong><span>@{{handle}} <i>·</i> {{time}}</span></div></div><button class="quiet-icon" data-action="post-menu" aria-label="Post options">···</button></header>
<div class="post-media-wrap">{{media}}<span class="media-count">{{mediaLabel}}</span><button class="media-open" data-action="view-post" aria-label="Open post">↗</button></div>
<div class="post-content"><div class="post-actions"><div class="post-actions-left"><button class="post-action like-action {{likedClass}}" data-action="like" aria-label="Like post"><span class="heart-icon">{{heart}}</span></button><button class="post-action" data-action="comment" aria-label="Comment">◯</button><button class="post-action share-action" data-action="share" aria-label="Share">↗</button></div><button class="post-action save-action {{savedClass}}" data-action="save" aria-label="Save post">▱</button></div>
<div class="likes-line"><strong>{{likes}}</strong> appreciations</div><p class="post-caption"><strong>{{handle}}</strong> {{caption}}</p><button class="view-comments" data-action="comment">View all {{commentCount}} comments</button><div class="post-comment-preview">{{commentPreview}}</div><form class="comment-form"><input name="comment" placeholder="Leave a little love..." aria-label="Write a comment"><button type="submit" aria-label="Post comment">↗</button></form></div></article>
