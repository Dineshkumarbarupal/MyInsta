name: MyInsta checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependency
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q PyAppName/py.26.09.21/theme/PyAppName_Basic/User
      - name: Run SQLite service tests
        run: python -m unittest discover -s PyAppName/py.26.09.21/theme/PyAppName_Basic/User/tests -v
      - name: Check JavaScript syntax
        run: find PyAppName/py.26.09.21/theme/PyAppName_Basic/User/js -name '*.js' -print0 | xargs -0 -n1 node --check
